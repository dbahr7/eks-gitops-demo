# Local end-to-end test: DynamoDB Local + api + web, no AWS needed.
#   docker compose up --build      then open http://localhost:8080
#   docker compose down            stop and remove everything (votes are in memory, so they're gone)
#
# Local testing only. GitHub Actions and EKS don't use this file; they use the two Dockerfiles.

services:
  # Local stand-in for the real DynamoDB service. Keeps data in memory.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2

  # One-shot job: waits for DynamoDB Local, then creates the "votes" table and exits.
  # (On EKS, Terraform creates the real table instead.)
  dynamodb-init:
    image: amazon/aws-cli:2.41.0
    depends_on:
      - dynamodb
    environment: &dummy-aws
      AWS_ACCESS_KEY_ID: dummy        # DynamoDB Local accepts anything, but AWS SDKs
      AWS_SECRET_ACCESS_KEY: dummy    # refuse to send a request without credentials
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb:8000 >/dev/null 2>&1; do sleep 1; done
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
          --table-name votes \
          --attribute-definitions AttributeName=pk,AttributeType=S \
          --key-schema AttributeName=pk,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST >/dev/null
        echo "table votes created"

  api:
    build: ./app/api
    image: eks-gitops-demo-api:dev
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully   # table must exist first
    environment:
      <<: *dummy-aws
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      TABLE_NAME: votes
    # Same idea as the Kubernetes readiness probe: "healthy" only once /readyz returns 200.
    # The image has no curl, so it uses Python's standard library.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: ./app/web
    image: eks-gitops-demo-web:dev
    depends_on:
      api:
        condition: service_healthy   # nginx resolves "api" at startup, so api goes first
    ports:
      - "8080:8080"   # the only port published to your PC
