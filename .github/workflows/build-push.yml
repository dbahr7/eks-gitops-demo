# Build the api and web images and push them to ECR, tagged with the git commit SHA.
# AWS access is through GitHub OIDC (terraform/ci): no AWS keys are stored in GitHub.

name: build-push

on:
  push:
    branches: [main]
    paths:
      - "app/**"                              # only app changes rebuild images
      - ".github/workflows/build-push.yml"    # ...and changes to this workflow itself
  workflow_dispatch: {}                       # "Run workflow" button in the Actions tab

# Least privilege for the job's GITHUB_TOKEN.
permissions:
  id-token: write   # lets the job request the OIDC token that AWS exchanges for credentials
  contents: read    # lets actions/checkout read the repo

# If two pushes land close together, finish the first before starting the next.
concurrency:
  group: build-push
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT: eks-gitops-demo

jobs:
  build-push:
    runs-on: ubuntu-latest

    # One job per image, run in parallel: the same steps with image = api, then image = web.
    strategy:
      matrix:
        image: [api, web]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Get AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}   # repo variable, set with `gh variable set`
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The repositories are IMMUTABLE: pushing a tag that already exists fails.
      # That happens when "Run workflow" is clicked again on the same commit,
      # so check first and skip the build if this commit's image is already there.
      # (batch-get-image is used because the role is already allowed to call it.)
      - name: Check whether this commit's image already exists
        id: check
        run: |
          count=$(aws ecr batch-get-image \
            --repository-name "$PROJECT/${{ matrix.image }}" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'length(images)' --output text)
          if [ "$count" -gt 0 ]; then
            echo "Image $PROJECT/${{ matrix.image }}:$GITHUB_SHA already in ECR, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: app/${{ matrix.image }}    # the folder with this image's Dockerfile
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT }}/${{ matrix.image }}:${{ github.sha }}
